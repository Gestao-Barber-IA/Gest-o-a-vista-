<head>

<style>
:root { --bg:#0c0c0e; --s1:#161618; --s2:#1f1f22; --s3:#2a2a2e; --line:#2d2c30; --fg:#f6f2e8; --muted:#aaa59a; --faint:#6f6b63;
  --ac:#d6b46a; --ac2:#b08c42; --ink:#1d1607; --ok:#52d37e; --bad:#ff6b6b; --r:18px; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); font-family:"Hind",system-ui,sans-serif; font-size:17px; line-height:1.4; }
body { --g1:rgba(52,88,190,.16); --g2:rgba(212,178,102,.10); background: radial-gradient(900px 500px at 0% -10%, var(--g1), transparent 60%), radial-gradient(700px 500px at 110% 110%, var(--g2), transparent 60%), var(--bg); background-attachment:fixed; }
.app { max-width:560px; margin:0 auto; padding: max(14px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); min-height:100vh; display:flex; flex-direction:column; }
header { display:flex; align-items:center; gap:12px; min-height:56px; margin-bottom:8px; }
header img { width:48px; height:48px; border-radius:50%; object-fit:contain; background:var(--logo-bg, var(--s2)); box-shadow:0 0 0 2px var(--ac); }
header .nm { font-family:"Archivo",sans-serif; font-weight:800; font-size:18px; letter-spacing:.01em; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lk { background:none; border:0; color:var(--ac); font:inherit; font-size:15px; font-weight:600; padding:8px 4px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
h1 { font-family:"Archivo",sans-serif; font-weight:800; font-size:26px; line-height:1.15; margin:8px 0 6px; }
h2 { font-family:"Archivo",sans-serif; font-weight:700; font-size:19px; margin:22px 0 10px; }
p.sub { color:var(--muted); margin:0 0 18px; }
.card { background:var(--s1); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-bottom:12px; }
.aviso { background:color-mix(in srgb, var(--ac) 14%, var(--s1)); border:1px solid color-mix(in srgb, var(--ac) 40%, transparent); border-radius:14px; padding:10px 14px; margin-bottom:14px; font-size:15px; }
label.f { display:block; margin-bottom:14px; }
label.f span { display:block; font-weight:600; margin-bottom:6px; font-size:15px; }
input.in { width:100%; font:inherit; font-size:18px; color:var(--fg); background:var(--s2); border:1px solid var(--line); border-radius:14px; padding:13px 14px; outline:none; }
input.in:focus { border-color:var(--ac); box-shadow:0 0 0 3px color-mix(in srgb, var(--ac) 25%, transparent); }
input.cod { text-align:center; letter-spacing:.5em; font-family:"Archivo",sans-serif; font-size:30px; font-weight:800; padding-left:.5em; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.btn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; font:inherit; font-weight:700; font-size:18px; border-radius:16px; padding:15px 18px; border:1px solid var(--line); background:var(--s2); color:var(--fg); cursor:pointer; }
.btn.pri { background:var(--ac); border-color:var(--ac); color:var(--ink); box-shadow:0 10px 30px var(--glow, rgba(214,180,106,.25)); }
.btn:disabled { opacity:.5; cursor:default; }
.btn + .btn { margin-top:10px; }
.msg { min-height:1.4em; margin:4px 0 12px; font-size:15px; color:var(--bad); }
.msg.ok { color:var(--ok); }
.passos { display:flex; gap:6px; margin:4px 0 14px; } .passos i { flex:1; height:4px; border-radius:4px; background:var(--s3); } .passos i.on { background:var(--ac); }
.op { display:flex; align-items:center; gap:12px; width:100%; text-align:left; font:inherit; color:var(--fg); background:var(--s1); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; cursor:pointer; }
.op.on { border-color:var(--ac); background:color-mix(in srgb, var(--ac) 12%, var(--s1)); }
.op .tx { flex:1; min-width:0; } .op b { display:block; font-size:17px; } .op small { color:var(--muted); font-size:14px; }
.op .ck { width:24px; height:24px; border-radius:50%; border:2px solid var(--line); flex:0 0 24px; display:grid; place-items:center; color:var(--ink); font-size:14px; font-weight:800; }
.op.on .ck { background:var(--ac); border-color:var(--ac); }
.av { width:44px; height:44px; border-radius:50%; object-fit:cover; background:var(--s3); flex:0 0 44px; display:grid; place-items:center; font-family:"Archivo",sans-serif; font-weight:800; color:var(--ac); }
.dias { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; margin:0 -2px 6px; scrollbar-width:none; } .dias::-webkit-scrollbar { display:none; }
.dia { flex:0 0 64px; text-align:center; font:inherit; color:var(--fg); background:var(--s1); border:1px solid var(--line); border-radius:14px; padding:8px 4px; cursor:pointer; }
.dia small { display:block; color:var(--muted); font-size:13px; text-transform:capitalize; } .dia b { font-family:"Archivo",sans-serif; font-size:20px; }
.dia.on { background:var(--ac); border-color:var(--ac); color:var(--ink); } .dia.on small { color:var(--ink); }
.horas { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:8px; }
.hora { font:inherit; font-weight:700; font-size:17px; color:var(--fg); background:var(--s1); border:1px solid var(--line); border-radius:12px; padding:11px 4px; cursor:pointer; }
.hora.on { background:var(--ac); border-color:var(--ac); color:var(--ink); }
.vazio { color:var(--muted); text-align:center; padding:18px 8px; }
.resumo div { display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); } .resumo div:last-child { border:0; }
.resumo span { color:var(--muted); } .resumo b { text-align:right; }
.ag { display:flex; gap:12px; align-items:flex-start; }
.ag .dt { flex:0 0 58px; text-align:center; background:var(--s2); border-radius:12px; padding:6px 2px; }
.ag .dt small { display:block; color:var(--muted); font-size:12px; text-transform:uppercase; } .ag .dt b { font-family:"Archivo",sans-serif; font-size:22px; }
.ag .tx { flex:1; min-width:0; } .ag .tx b { display:block; } .ag .tx small { color:var(--muted); }
.st { display:inline-block; font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; padding:2px 8px; border-radius:999px; background:var(--s3); color:var(--muted); margin-top:4px; }
.st.agendado, .st.confirmado { background:color-mix(in srgb, var(--ok) 18%, transparent); color:var(--ok); }
.st.cancelado, .st.faltou { background:color-mix(in srgb, var(--bad) 16%, transparent); color:var(--bad); }
.ok-ico { width:76px; height:76px; border-radius:50%; background:color-mix(in srgb, var(--ok) 18%, transparent); color:var(--ok); display:grid; place-items:center; font-size:40px; margin:20px auto 8px; }
.centro { text-align:center; }
.spin { width:36px; height:36px; border-radius:50%; border:3px solid var(--s3); border-top-color:var(--ac); animation:g 0.8s linear infinite; margin:60px auto 12px; } @keyframes g { to { transform:rotate(360deg); } }
.rod { margin-top:auto; padding-top:24px; text-align:center; color:var(--faint); font-size:13px; }
:focus-visible { outline:2px solid var(--ac); outline-offset:2px; }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration:3s; } }
</style>
</head>
<body>
<div class="app">
  <header><img id="logo" alt="" hidden><span class="nm" id="nm"></span><span id="topo"></span></header>
  <main id="m"><div class="spin" role="status" aria-label="Carregando"></div></main>
  <p class="rod" id="rod">Agendamento online · Gestão Barber IA</p>
</div>
<script>
(function () {
  'use strict';
  var URL_FN = 'https://sekkmnkajnaqubyhpxvd.supabase.co/functions/v1/agenda-app', ANON = 'sb_publishable_H_B9KotYo03JbNmuERyf6Q_1u-RyKYB';
  var DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'], DIASL = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var reais = function (v) { return 'R$ ' + Number(v || 0).toLocaleString('pt-BR', { minimumFractionDigits: Number(v) % 1 ? 2 : 0, maximumFractionDigits: 2 }); };
  var emp = ''; try { emp = new URLSearchParams(location.hash.slice(1)).get('e') || ''; } catch (e) { emp = ''; }
  if (!emp) { try { emp = localStorage.getItem('gbAgEmp') || ''; } catch (e) { emp = ''; } } else { try { localStorage.setItem('gbAgEmp', emp); } catch (e) { /* segue */ } }
  var KEY = 'gbAg:' + emp, token = ''; try { token = localStorage.getItem(KEY) || ''; } catch (e) { token = ''; }
  var info = null, eu = null, st = {}, tela = '';

  function chamar(acao, dados) {
    return fetch(URL_FN, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: ANON }, body: JSON.stringify({ empresa: emp, acao: acao, dados: dados || {}, token: token || undefined }) })
      .then(function (r) { return r.json().catch(function () { return { erro: 'Sem resposta. Tente de novo.' }; }).then(function (j) {
        if (r.status === 401) { sair(true); }
        if (!r.ok || j.erro) { var e = new Error(j.erro || 'Não deu certo. Tente de novo.'); e.status = r.status; throw e; }
        return j; }); }, function () { throw new Error('Sem internet. Confira a conexão e tente de novo.'); });
  }
  function guardar(t) { token = t; try { if (t) localStorage.setItem(KEY, t); else localStorage.removeItem(KEY); } catch (e) { /* segue */ } }
  function sair(silencioso) { guardar(''); eu = null; if (!silencioso) chamar('sair').catch(function () {}); }
  var m = $('m');
  function pinta(html) { m.innerHTML = html; var f = m.querySelector('[autofocus]'); if (f) f.focus(); window.scrollTo(0, 0); }
  function carregando(t) { pinta('<div class="spin" role="status"></div><p class="centro sub">' + esc(t || 'Carregando…') + '</p>'); }
  function msg(t, ok) { var el = m.querySelector('.msg'); if (el) { el.textContent = t || ''; el.className = 'msg' + (ok ? ' ok' : ''); } }
  function foneFmt(d) { d = String(d || '').replace(/\D/g, ''); return d.length === 11 ? '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7) : d.length === 10 ? '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6) : d; }
  function dataTxt(iso, longo) { var d = new Date(iso + 'T12:00:00'); var hoje = info && info.hoje; if (iso === hoje) return 'hoje'; var am = new Date(hoje + 'T12:00:00'); am.setDate(am.getDate() + 1); if (iso === am.toISOString().slice(0, 10)) return 'amanhã';
    return (longo ? DIASL : DIAS)[d.getDay()] + ', ' + String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0'); }
  function topo() { $('topo').innerHTML = eu && tela !== 'perfil' ? '<button class="lk" data-a="perfil">Meu cadastro</button>' : ''; }
  function ir(t, x) { tela = t; st.x = x || {}; topo(); TELAS[t](); }

  var TELAS = {
    erro: function () { pinta('<h1>Ops!</h1><p class="sub">' + esc(st.x.erro || 'Não deu certo.') + '</p>' + (st.x.voltar ? '<button class="btn pri" data-a="' + st.x.voltar + '">Tentar de novo</button>' : '')); },
    entrar: function () {
      pinta(testeAviso() + '<h1>Agende seu horário</h1><p class="sub">Cadastro rápido: só o seu nome e o seu WhatsApp. Vamos mandar um código de 4 números para confirmar.</p>' + (info.aviso ? '<div class="aviso">' + esc(info.aviso) + '</div>' : '') +
        '<form id="fe" novalidate><div class="row2"><label class="f"><span>Nome</span><input class="in" name="nome" autocomplete="given-name" maxlength="40" value="' + esc(st.nome || '') + '" autofocus></label>' +
        '<label class="f"><span>Sobrenome</span><input class="in" name="sobrenome" autocomplete="family-name" maxlength="60" value="' + esc(st.sobrenome || '') + '"></label></div>' +
        '<label class="f"><span>WhatsApp com DDD</span><input class="in" name="fone" type="tel" inputmode="tel" autocomplete="tel-national" maxlength="16" placeholder="(11) 91234-5678" value="' + esc(st.fone ? foneFmt(st.fone) : '') + '"></label>' +
        '<p class="msg" role="alert"></p><button class="btn pri" type="submit">Receber código no WhatsApp</button></form>');
      $('fe').fone.addEventListener('input', function (e) { var d = e.target.value.replace(/\D/g, '').slice(0, 11); e.target.value = foneFmt(d); });
      $('fe').addEventListener('submit', function (e) { e.preventDefault(); var f = e.target, nome = f.nome.value.trim(), sob = f.sobrenome.value.trim(), fone = f.fone.value.replace(/\D/g, '');
        if (fone.length > 11 && fone.indexOf('55') === 0) fone = fone.slice(2);
        if (!nome || !sob) return msg('Informe o nome e o sobrenome.');
        if (fone.length < 10 || fone.length > 11) return msg('Confira o WhatsApp com DDD.');
        st.nome = nome; st.sobrenome = sob; st.fone = fone; f.querySelector('button').disabled = true; msg('Enviando o código…', true);
        chamar('codigo', { nome: nome, sobrenome: sob, fone: fone }).then(function () { st.enviadoEm = Date.now(); ir('codigo'); }).catch(function (er) { f.querySelector('button').disabled = false; msg(er.message); }); });
    },
    codigo: function () {
      pinta('<h1>Digite o código</h1><p class="sub">Mandamos um código de 4 números para o WhatsApp <b>' + esc(foneFmt(st.fone)) + '</b>.</p>' +
        '<form id="fc" novalidate><label class="f"><span>Código</span><input class="in cod" name="cod" inputmode="numeric" autocomplete="one-time-code" maxlength="4" pattern="[0-9]*" autofocus></label>' +
        '<p class="msg" role="alert"></p><button class="btn pri" type="submit">Confirmar</button></form>' +
        '<p class="centro"><button class="lk" data-a="reenviar" id="re">Reenviar código</button> · <button class="lk" data-a="trocar">Trocar número</button></p>');
      var f = $('fc'); f.cod.addEventListener('input', function () { f.cod.value = f.cod.value.replace(/\D/g, '').slice(0, 4); if (f.cod.value.length === 4) f.requestSubmit ? f.requestSubmit() : f.querySelector('button').click(); });
      f.addEventListener('submit', function (e) { e.preventDefault(); var c = f.cod.value; if (c.length !== 4) return msg('Digite os 4 números.');
        f.querySelector('button').disabled = true; msg('Conferindo…', true);
        chamar('verificar', { fone: st.fone, codigo: c }).then(function (r) { guardar(r.token); return inicio(); }).catch(function (er) { f.querySelector('button').disabled = false; f.cod.value = ''; msg(er.message); }); });
    },
    home: function () {
      var c = eu.cliente, prox = eu.agendamentos.filter(function (a) { return new Date(a.inicio) >= new Date(Date.now() - 3600000) && ['agendado', 'confirmado', 'chegou'].indexOf(a.status) >= 0; }),
        pass = eu.agendamentos.filter(function (a) { return prox.indexOf(a) < 0; }).reverse().slice(0, 4), falta = !c.email || !c.nascimento;
      var item = function (a, botoes) { var d = new Date(a.inicio), iso = d.toLocaleDateString('en-CA'), h = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
        return '<div class="card ag"><div class="dt"><small>' + DIAS[d.getDay()] + '</small><b>' + String(d.getDate()).padStart(2, '0') + '</b><small>' + d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '') + '</small></div>' +
          '<div class="tx"><b>' + esc(dataTxt(iso, true)) + ' às ' + h.replace(':', 'h') + '</b><small>' + esc(a.servicos.join(' + ')) + (a.profissional ? ' · com ' + esc(a.profissional.split(' ')[0]) : '') + '</small><br><span class="st ' + esc(a.status) + '">' + esc(a.status) + '</span>' +
          (botoes && a.pode_cancelar ? '<br><button class="lk" data-a="cancelar" data-id="' + esc(a.id) + '">' + (st.conf === a.id ? 'Confirmar cancelamento' : 'Cancelar horário') + '</button>' : '') +
          (botoes && !a.pode_cancelar && ['agendado', 'confirmado'].indexOf(a.status) >= 0 ? '<br><small>Para cancelar agora, fale com a barbearia.</small>' : '') + '</div></div>'; };
      pinta(testeAviso() + '<h1>Olá, ' + esc(c.nome) + '!</h1>' + (info.aviso ? '<div class="aviso">' + esc(info.aviso) + '</div>' : '') +
        '<button class="btn pri" data-a="novo">Agendar horário</button>' +
        (falta ? '<div class="card" style="margin-top:14px"><b>Complete seu cadastro</b><p class="sub" style="margin:4px 0 8px">Assim a gente lembra do seu aniversário 🎉</p><button class="btn" data-a="perfil">Completar cadastro</button></div>' : '') +
        '<h2>Seus próximos horários</h2>' + (prox.length ? prox.map(function (a) { return item(a, true); }).join('') : '<p class="vazio">Nenhum horário marcado.</p>') +
        (pass.length ? '<h2>Últimos</h2>' + pass.map(function (a) { return item(a, false); }).join('') : '') +
        '<p class="centro"><button class="lk" data-a="sair">Sair</button></p>');
    },
    servicos: function () {
      st.sel = st.sel || [];
      var dur = 0, val = 0; st.sel.forEach(function (id) { var s = servPor(id); if (s) { dur += s.duracao; val += s.preco; } });
      pinta(passos(1) + '<h1>Qual serviço?</h1><p class="sub">Pode escolher mais de um.</p>' + (info.servicos.length ? info.servicos.map(function (s) { var on = st.sel.indexOf(s.id) >= 0;
        return '<button class="op' + (on ? ' on' : '') + '" data-a="serv" data-id="' + esc(s.id) + '" aria-pressed="' + on + '"><span class="tx"><b>' + esc(s.nome) + '</b><small>' + s.duracao + ' min' + (s.preco ? ' · ' + reais(s.preco) : '') + '</small></span><span class="ck">' + (on ? '✓' : '') + '</span></button>'; }).join('') : '<p class="vazio">Nenhum serviço disponível online.</p>') +
        '<button class="btn pri" data-a="aProf"' + (st.sel.length ? '' : ' disabled') + '>Continuar' + (st.sel.length ? ' · ' + dur + ' min' + (val ? ' · ' + reais(val) : '') : '') + '</button><button class="btn" data-a="home">Voltar</button>');
    },
    prof: function () {
      var ps = info.profissionais.filter(function (p) { return !p.servicos.length || st.sel.every(function (id) { return p.servicos.indexOf(id) >= 0; }); });
      var av = function (p) { return p.foto ? '<img class="av" src="' + esc(p.foto) + '" alt="">' : '<span class="av">' + esc(p.nome.charAt(0)) + '</span>'; };
      pinta(passos(2) + '<h1>Com quem?</h1><p class="sub">Escolha o profissional ou deixe que a gente escolhe.</p>' +
        '<button class="op" data-a="prof" data-id=""><span class="av">✦</span><span class="tx"><b>Sem preferência</b><small>Mostra todos os horários livres</small></span></button>' +
        ps.map(function (p) { return '<button class="op" data-a="prof" data-id="' + esc(p.id) + '">' + av(p) + '<span class="tx"><b>' + esc(p.nome) + '</b></span></button>'; }).join('') +
        (ps.length ? '' : '<p class="vazio">Nenhum profissional faz todos esses serviços juntos. Volte e escolha menos serviços.</p>') + '<button class="btn" data-a="aServ">Voltar</button>');
    },
    dia: function () {
      var lista = [], d0 = new Date(info.hoje + 'T12:00:00');
      for (var i = 0; i <= info.dias_max && lista.length < 60; i++) { var d = new Date(d0); d.setDate(d.getDate() + i); if (info.fechados.indexOf(d.getDay()) < 0) lista.push(d.toISOString().slice(0, 10)); }
      st.data = st.data && lista.indexOf(st.data) >= 0 ? st.data : lista[0];
      var r = st.porDia && st.porDia[st.data], horas = horasDe(r);
      var nomeP = st.prof ? (info.profissionais.filter(function (p) { return p.id === st.prof; })[0] || {}).nome : '';
      pinta(passos(3) + '<h1>Qual dia e horário?</h1><p class="sub">' + (nomeP ? 'Com ' + esc(nomeP.split(' ')[0]) : 'Sem preferência de profissional') + ' · ' + duracao() + ' min</p>' +
        '<div class="dias" id="dias">' + lista.map(function (x) { var d = new Date(x + 'T12:00:00'); return '<button class="dia' + (x === st.data ? ' on' : '') + '" data-a="dia" data-d="' + x + '"><small>' + (x === info.hoje ? 'hoje' : DIAS[d.getDay()]) + '</small><b>' + String(d.getDate()).padStart(2, '0') + '</b><small>' + d.toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '') + '</small></button>'; }).join('') + '</div>' +
        (!r ? '<div class="spin" role="status"></div>' : r.erro ? '<p class="vazio">' + esc(r.erro) + '</p>' : horas.length ? '<div class="horas">' + horas.map(function (h) { return '<button class="hora" data-a="hora" data-h="' + h + '">' + h + '</button>'; }).join('') + '</div>' : '<p class="vazio">Sem horários livres nesse dia. Escolha outro dia.</p>') +
        '<p></p><button class="btn" data-a="aProf">Voltar</button>');
      var sel = m.querySelector('.dia.on'); if (sel) sel.scrollIntoView({ inline: 'center', block: 'nearest' });
      if (!r) buscar(st.data);
    },
    confirmar: function () {
      var ss = st.sel.map(servPor).filter(Boolean), val = ss.reduce(function (t, s) { return t + s.preco; }, 0), p = st.prof ? info.profissionais.filter(function (x) { return x.id === st.prof; })[0] : null;
      pinta(passos(4) + '<h1>Confirme</h1><div class="card resumo"><div><span>Serviço</span><b>' + esc(ss.map(function (s) { return s.nome; }).join(' + ')) + '</b></div>' +
        '<div><span>Profissional</span><b>' + esc(p ? p.nome : 'Sem preferência') + '</b></div><div><span>Quando</span><b>' + esc(dataTxt(st.data, true)) + ' às ' + esc(st.hora.replace(':', 'h')) + '</b></div>' +
        '<div><span>Duração</span><b>' + duracao() + ' min</b></div>' + (val ? '<div><span>Valor</span><b>' + reais(val) + '</b></div>' : '') + '</div>' +
        '<p class="msg" role="alert"></p><button class="btn pri" data-a="agendar">Confirmar agendamento</button><button class="btn" data-a="aDia">Voltar</button>');
    },
    feito: function () {
      var r = st.x;
      pinta('<div class="ok-ico" aria-hidden="true">✓</div><h1 class="centro">Horário marcado!</h1><p class="sub centro">' + esc(dataTxt(r.data, true)) + ' às ' + esc(r.hora.replace(':', 'h')) + ' com ' + esc(String(r.profissional).split(' ')[0]) + '.<br>A confirmação vai chegar no seu WhatsApp.</p><button class="btn pri" data-a="home">Ver meus horários</button>');
    },
    perfil: function () {
      var c = eu.cliente;
      pinta('<h1>Meu cadastro</h1><p class="sub">WhatsApp: <b>' + esc(foneFmt(c.fone)) + '</b></p><form id="fp" novalidate>' +
        '<div class="row2"><label class="f"><span>Nome</span><input class="in" name="nome" maxlength="40" value="' + esc(c.nome) + '"></label><label class="f"><span>Sobrenome</span><input class="in" name="sobrenome" maxlength="60" value="' + esc(c.sobrenome) + '"></label></div>' +
        '<label class="f"><span>E-mail (opcional)</span><input class="in" name="email" type="email" inputmode="email" autocomplete="email" maxlength="120" value="' + esc(c.email || '') + '"></label>' +
        '<label class="f"><span>Data de nascimento (opcional)</span><input class="in" name="nascimento" type="date" max="' + esc(info.hoje) + '" value="' + esc(c.nascimento || '') + '"></label>' +
        '<p class="msg" role="alert"></p><button class="btn pri" type="submit">Salvar</button><button class="btn" type="button" data-a="home">Voltar</button></form>');
      $('fp').addEventListener('submit', function (e) { e.preventDefault(); var f = e.target, d = { nome: f.nome.value.trim(), sobrenome: f.sobrenome.value.trim(), email: f.email.value.trim(), nascimento: f.nascimento.value };
        if (!d.nome || !d.sobrenome) return msg('Nome e sobrenome não podem ficar vazios.');
        f.querySelector('button').disabled = true; msg('Salvando…', true);
        chamar('perfil', d).then(function () { Object.assign(eu.cliente, d); msg('Cadastro salvo.', true); f.querySelector('button').disabled = false; }).catch(function (er) { f.querySelector('button').disabled = false; msg(er.message); }); });
    },
  };
  function testeAviso() { return info && info.teste ? '<div class="aviso"><b>Modo de teste.</b> Os horários marcados aqui ainda não valem na agenda oficial da barbearia.</div>' : ''; }
  function passos(n) { var h = '<div class="passos" aria-label="Passo ' + n + ' de 4">'; for (var i = 1; i <= 4; i++) h += '<i class="' + (i <= n ? 'on' : '') + '"></i>'; return h + '</div>'; }
  function servPor(id) { return info.servicos.filter(function (s) { return s.id === id; })[0]; }
  function duracao() { return st.sel.reduce(function (t, id) { var s = servPor(id); return t + (s ? s.duracao : 0); }, 0); }
  function horasDe(r) { if (!r || r.erro) return []; var set = {}; r.profissionais.forEach(function (p) { p.horarios.forEach(function (h) { set[h] = 1; }); }); return Object.keys(set).sort(); }
  function buscar(dia) {
    var chave = st.chave = dia + '|' + (st.prof || '') + '|' + st.sel.join(',');
    chamar('horarios', { data: dia, servicos: st.sel, profissional: st.prof || null }).then(function (r) { if (st.chave !== chave) return; st.porDia[dia] = r; if (tela === 'dia' && st.data === dia) TELAS.dia(); })
      .catch(function (e) { if (st.chave !== chave) return; st.porDia[dia] = { erro: e.message }; if (tela === 'dia' && st.data === dia) TELAS.dia(); });
  }
  function novoBusca() { st.porDia = {}; st.chave = ''; }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b) return; var a = b.dataset.a;
    if (a === 'home') { st.conf = null; return inicio(); }
    if (a === 'perfil') return ir('perfil');
    if (a === 'sair') { sair(); st = {}; return ir('entrar'); }
    if (a === 'trocar') return ir('entrar');
    if (a === 'reenviar') { if (Date.now() - (st.enviadoEm || 0) < 60000) return msg('Aguarde 1 minuto para pedir outro código.');
      msg('Enviando…', true); return chamar('codigo', { nome: st.nome, sobrenome: st.sobrenome, fone: st.fone }).then(function () { st.enviadoEm = Date.now(); msg('Código reenviado.', true); }).catch(function (er) { msg(er.message); }); }
    if (a === 'novo') { st.sel = []; st.prof = null; st.data = null; return ir('servicos'); }
    if (a === 'serv') { var i = st.sel.indexOf(b.dataset.id); if (i >= 0) st.sel.splice(i, 1); else st.sel.push(b.dataset.id); return TELAS.servicos(); }
    if (a === 'aServ') return ir('servicos');
    if (a === 'aProf') return ir('prof');
    if (a === 'prof') { st.prof = b.dataset.id || null; novoBusca(); return ir('dia'); }
    if (a === 'aDia') return ir('dia');
    if (a === 'dia') { st.data = b.dataset.d; return TELAS.dia(); }
    if (a === 'hora') { st.hora = b.dataset.h; return ir('confirmar'); }
    if (a === 'agendar') { b.disabled = true; msg('Marcando…', true);
      return chamar('agendar', { data: st.data, hora: st.hora, servicos: st.sel, profissional: st.prof || null }).then(function (r) { eu = null; ir('feito', r); })
        .catch(function (er) { b.disabled = false; msg(er.message); if (er.status === 409) { delete st.porDia[st.data]; } }); }
    if (a === 'cancelar') { if (st.conf !== b.dataset.id) { st.conf = b.dataset.id; return TELAS.home(); }
      st.conf = null; carregando('Cancelando…'); return chamar('cancelar', { id: b.dataset.id }).then(function () { return inicio(); }).catch(function (er) { ir('erro', { erro: er.message, voltar: 'home' }); }); }
  });

  // Cores da página a partir do logo (mesma leitura de cores do totem): destaque na cor principal e fundo na cor da marca.
  function mix(a, b, t) { var p = function (h) { return [1, 3, 5].map(function (i) { return parseInt(h.slice(i, i + 2), 16); }); }, A = p(a), B = p(b); return '#' + A.map(function (v, i) { return Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0'); }).join(''); }
  function lum(h) { var c = [1, 3, 5].map(function (i) { return parseInt(h.slice(i, i + 2), 16) / 255; }); return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
  function aplicarCores(src) {
    var im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = function () {
      try {
        var cv = document.createElement('canvas'); cv.width = cv.height = 64; var c = cv.getContext('2d'); c.drawImage(im, 0, 0, 64, 64);
        var d = c.getImageData(0, 0, 64, 64).data, bins = {};
        var cs = [0, 63, 64 * 63, 64 * 64 - 1].map(function (q) { return q * 4; }), op = cs.filter(function (q) { return d[q + 3] > 200; });
        if (op.length) { var bg = [0, 1, 2].map(function (k) { return Math.round(op.reduce(function (t, q) { return t + d[q + k]; }, 0) / op.length); });
          document.documentElement.style.setProperty('--logo-bg', '#' + bg.map(function (v) { return v.toString(16).padStart(2, '0'); }).join('')); }
        for (var i = 0; i < d.length; i += 4) {
          var r = d[i], g = d[i + 1], bb = d[i + 2]; if (d[i + 3] < 200) continue;
          var mx = Math.max(r, g, bb), mn = Math.min(r, g, bb), l = (mx + mn) / 2, sat = mx === mn ? 0 : (mx - mn) / (255 - Math.abs(mx + mn - 255));
          if (sat < 0.3 || l < 40 || l > 235) continue;
          var hh = mx === r ? ((g - bb) / (mx - mn)) % 6 : mx === g ? (bb - r) / (mx - mn) + 2 : (r - g) / (mx - mn) + 4; hh = (hh * 60 + 360) % 360;
          var k = Math.round(hh / 24) % 15, x = bins[k] || (bins[k] = { w: 0, n: 0, r: 0, g: 0, b: 0, h: k });
          x.w += sat; x.n++; x.r += r; x.g += g; x.b += bb;
        }
        var top = Object.keys(bins).map(function (q) { return bins[q]; }).filter(function (x) { return x.n > 12; }).sort(function (x, y) { return y.w - x.w; });
        if (!top.length) return;
        var hex = function (x) { return '#' + [x.r, x.g, x.b].map(function (v) { return Math.round(v / x.n).toString(16).padStart(2, '0'); }).join(''); };
        var far = top.filter(function (x) { return Math.min(Math.abs(x.h - top[0].h), 15 - Math.abs(x.h - top[0].h)) >= 3; })[0];
        var A = mix(hex(top[0]), '#ffffff', 0.15), Bc = far ? hex(far) : mix(hex(top[0]), '#000000', 0.45);
        var s = document.documentElement.style, set = function (k2, v) { s.setProperty(k2, v); };
        set('--ac', A); set('--ac2', mix(A, '#000000', 0.25)); set('--ink', lum(A) > 0.5 ? '#14100a' : '#ffffff'); set('--glow', A + '44');
        set('--bg', mix(Bc, '#000000', 0.86)); set('--s1', mix(Bc, '#000000', 0.78)); set('--s2', mix(Bc, '#000000', 0.72)); set('--s3', mix(Bc, '#000000', 0.62)); set('--line', mix(Bc, '#000000', 0.58));
        document.body.style.setProperty('--g1', Bc + '55'); document.body.style.setProperty('--g2', A + '26');
        document.querySelector('meta[name=theme-color]').setAttribute('content', mix(Bc, '#000000', 0.86));
      } catch (e) { /* logo sem permissão de leitura: fica com as cores padrão */ }
    };
    im.src = src;
  }

  function inicio() {
    if (!token) return ir('entrar');
    carregando();
    return chamar('eu').then(function (r) { eu = r; ir('home'); }).catch(function (e) { if (e.status === 401 || !token) return ir('entrar'); ir('erro', { erro: e.message, voltar: 'home' }); });
  }
  if (!/^[0-9a-f-]{36}$/i.test(emp)) { tela = 'erro'; st.x = { erro: 'Link de agendamento inválido. Peça o link certo para a barbearia.' }; TELAS.erro(); }
  else chamar('info').then(function (r) {
    info = r; $('nm').textContent = r.nome || ''; if (r.marca === 'salao') $('rod').textContent = 'Agendamento online · Gestão Salão IA'; document.title = 'Agendar · ' + (r.nome || 'horário');
    if (r.logo && /^https:\/\//.test(r.logo)) { $('logo').src = r.logo; $('logo').hidden = false; aplicarCores(r.logo); }
    if (r.cliente && token) { eu = { cliente: r.cliente, agendamentos: [] }; }
    inicio();
  }).catch(function (e) { ir('erro', { erro: e.message }); });
})();
</script>
