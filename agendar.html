<style>
:root { --bg:#0c0c0e; --s1:#161618; --s2:#1f1f22; --s3:#2a2a2e; --line:#2d2c30; --fg:#f6f2e8; --muted:#aaa59a; --faint:#6f6b63;
  --ac:#d6b46a; --ac2:#b08c42; --ink:#1d1607; --ok:#52d37e; --bad:#ff6b6b; --star:#f5c542; --r:18px; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

.app { max-width:560px; margin:0 auto; padding: max(12px, env(safe-area-inset-top)) 16px calc(92px + env(safe-area-inset-bottom)); min-height:100vh; }

.row2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.btn.pri { background:var(--ac); border-color:var(--ac); color:var(--ink); box-shadow:0 10px 30px var(--glow, rgba(214,180,106,.25)); }

.btn + .btn { margin-top:10px; }
.btns2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; } .btns2 .btn + .btn { margin-top:0; }
.lk { background:none; border:0; color:var(--ac); font:inherit; font-size:15px; font-weight:600; padding:8px 4px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }
.msg { min-height:1.4em; margin:4px 0 12px; font-size:15px; color:var(--bad); } .msg.ok { color:var(--ok); }
.voltar { display:inline-flex; align-items:center; gap:6px; background:none; border:0; color:var(--muted); font:inherit; font-size:15px; padding:6px 0; cursor:pointer; }

.op.on { border-color:var(--ac); background:color-mix(in srgb, var(--ac) 12%, var(--s1)); }
.op .tx { flex:1; min-width:0; } .op b { display:block; font-size:17px; } .op small { color:var(--muted); font-size:14px; }

.op.on .ck { background:var(--ac); border-color:var(--ac); }

.st.agendado, .st.confirmado, .st.finalizado { background:color-mix(in srgb, var(--ok) 18%, transparent); color:var(--ok); }
.st.cancelado, .st.faltou { background:color-mix(in srgb, var(--bad) 16%, transparent); color:var(--bad); }
.acoes { display:flex; flex-wrap:wrap; gap:4px 14px; }
.ok-ico { width:76px; height:76px; border-radius:50%; background:color-mix(in srgb, var(--ok) 18%, transparent); color:var(--ok); display:grid; place-items:center; font-size:40px; margin:20px auto 8px; }
.centro { text-align:center; }

.banners { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 -16px 6px; padding:0 16px 6px; scrollbar-width:none; } .banners::-webkit-scrollbar { display:none; }

.pontos { display:flex; justify-content:center; gap:6px; margin-bottom:12px; } .pontos i { width:6px; height:6px; border-radius:50%; background:var(--s3); } .pontos i.on { background:var(--ac); }

.un img, .un .ph { width:64px; height:64px; border-radius:50%; object-fit:cover; flex:0 0 64px; background:var(--s2); box-shadow:0 0 0 2px var(--line); display:grid; place-items:center; color:var(--ac); font-family:"Archivo",sans-serif; font-weight:800; font-size:22px; }
.un b { display:block; font-size:18px; } .un small { display:block; color:var(--muted); font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .un .tx { min-width:0; flex:1; }

.circ { width:46px; height:46px; border-radius:50%; background:rgba(0,0,0,.6); border:0; color:#fff; display:grid; place-items:center; cursor:pointer; text-decoration:none; }

.sv { display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); }
.sv .tx { flex:1; min-width:0; } .sv b { display:block; font-size:18px; } .sv .ds { display:block; color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.04em; }
.sv .pr { display:flex; gap:14px; margin-top:4px; font-size:15px; } .sv .pr .v { color:var(--ok); font-weight:700; } .sv .pr .d { color:var(--muted); }
.sv .btn { flex:0 0 auto; }

.coracao svg { width:26px; height:26px; fill:none; stroke:currentColor; stroke-width:2; } .coracao.on svg { fill:currentColor; }
.det div { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); } .det div:last-child { border:0; }
.det span { color:var(--muted); flex:0 0 96px; font-size:15px; }
.plano { border-color:color-mix(in srgb, var(--ac) 40%, var(--line)); }
.plano b { font-family:"Archivo",sans-serif; font-size:20px; } .plano .v { color:var(--ac); font-family:"Archivo",sans-serif; font-size:24px; font-weight:800; margin:4px 0 8px; } .plano .v small { font-size:14px; color:var(--muted); }
.plano p { color:var(--muted); white-space:pre-line; margin:0 0 12px; }
.estrelas { color:var(--star); letter-spacing:2px; } .media { display:flex; align-items:center; gap:14px; } .media b { font-family:"Archivo",sans-serif; font-size:44px; }
.dep { padding:12px 0; border-bottom:1px solid var(--line); } .dep p { margin:4px 0 0; } .dep small { color:var(--muted); }
.notas { display:flex; justify-content:center; gap:8px; margin:10px 0 16px; }
.nota { font-size:38px; background:none; border:0; color:var(--s3); cursor:pointer; padding:0 2px; line-height:1; } .nota.on { color:var(--star); }
.chk { display:flex; gap:10px; align-items:flex-start; margin:8px 0 14px; font-size:15px; } .chk input { width:20px; height:20px; margin-top:2px; accent-color:var(--ac); }
/* Menu */
.perfil-h { display:flex; align-items:center; gap:14px; padding:10px 0 18px; border-bottom:1px solid var(--line); }
.perfil-h .av { width:64px; height:64px; flex-basis:64px; font-size:26px; }
.perfil-h b { font-size:20px; display:block; } .perfil-h small { color:var(--muted); }
.mi { display:flex; align-items:center; gap:14px; width:100%; padding:16px 2px; background:none; border:0; border-bottom:1px solid var(--line); color:var(--fg); font:inherit; text-align:left; cursor:pointer; text-decoration:none; }
.mi svg { width:24px; height:24px; flex:0 0 24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; color:var(--muted); }
.mi .tx { flex:1; } .mi b { display:block; font-size:18px; } .mi small { color:var(--muted); font-size:14px; }
.mi .seta { color:var(--faint); font-size:22px; }
.sair { color:var(--bad); font-weight:700; }

.termos { white-space:pre-line; color:var(--muted); font-size:15px; }

ol.passos li:not(:last-child)::after { content:""; position:absolute; top:15px; left:calc(50% + 18px); right:calc(-50% + 18px); height:2px; background:var(--s3); }

ol.passos li.ok i, ol.passos li.at i { background:var(--ac); border-color:var(--ac); color:var(--ink); } ol.passos li.at span { color:var(--fg); font-weight:700; }
.cal-h { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; } .cal-h b { font-family:"Archivo",sans-serif; }

.cd.livre { border-color:color-mix(in srgb, var(--ok) 60%, transparent); background:color-mix(in srgb, var(--ok) 12%, transparent); }
.cd.cheio { border-color:color-mix(in srgb, var(--bad) 45%, transparent); background:color-mix(in srgb, var(--bad) 10%, transparent); color:var(--muted); cursor:default; }
.cd.fora { color:var(--faint); cursor:default; } .cd.esp { color:var(--muted); }
.cd.on { background:var(--ac); border-color:var(--ac); color:var(--ink); }
.cal-l { display:flex; gap:16px; justify-content:center; margin-top:12px; font-size:13px; color:var(--muted); } .cal-l i { display:inline-block; width:10px; height:10px; border-radius:50%; vertical-align:-1px; }
.cal-l i.livre { background:var(--ok); } .cal-l i.cheio { background:var(--bad); }
h3.per { font-size:15px; color:var(--muted); margin:14px 0 8px; font-weight:700; }
.op.rec .pv { display:block; color:var(--ac); font-weight:700; font-size:15px; margin-top:2px; }
.op.rec .mais { width:30px; height:30px; flex:0 0 30px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font-weight:800; color:var(--muted); }
.op.rec.on .mais { background:var(--ac); border-color:var(--ac); color:var(--ink); }
.ic.pr { background:var(--s2); color:var(--ac); }
.card.cb { border-color:color-mix(in srgb, var(--star) 50%, var(--line)); background:color-mix(in srgb, var(--star) 10%, var(--s1)); }
.card.cb.ok { border-color:color-mix(in srgb, var(--ok) 50%, var(--line)); background:color-mix(in srgb, var(--ok) 12%, var(--s1)); }
.card.cb .eti { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); } .card.cb p { margin:6px 0 0; }
.card.cb .ganho b { font-family:"Archivo",sans-serif; font-size:26px; color:var(--ok); }
.chk2 { display:flex; gap:10px; align-items:center; cursor:pointer; } .chk2 input { width:22px; height:22px; accent-color:var(--ac); }
label.f .cup { display:flex; gap:8px; margin:0; font-weight:400; } .cup .in { text-transform:uppercase; } .cup .btn { flex:0 0 auto; }
.totais .neg b { color:var(--ok); } .totais .tot, .resumo .tot { border-top:1px solid var(--line); } .totais .tot b, .resumo .tot b { font-family:"Archivo",sans-serif; font-size:20px; color:var(--ac); }
.totais .sub2 span { font-size:13px; color:var(--muted); }
.topo-ok { display:flex; gap:14px; align-items:center; background:var(--ac); color:var(--ink); border-color:var(--ac); }
.topo-ok b { display:block; font-family:"Archivo",sans-serif; font-size:20px; } .topo-ok small { display:block; opacity:.85; font-size:14px; }
.topo-ok.grande { padding:22px 16px; } .topo-ok.grande b { font-size:24px; }
.ok-mini { width:46px; height:46px; flex:0 0 46px; border-radius:50%; background:rgba(255,255,255,.25); display:grid; place-items:center; font-size:24px; font-weight:800; }
.selo { display:inline-block; padding:4px 12px; border-radius:999px; background:color-mix(in srgb, var(--star) 22%, transparent); color:var(--star); font-size:13px; font-weight:700; }
.card.of { display:flex; gap:14px; align-items:center; } .card.of.on { border-color:var(--ac); } .card.of p { margin:4px 0 0; } .card.of s { color:var(--muted); } .card.of .por { color:var(--ac); font-size:20px; }
.tot-add { font-size:18px; margin:10px 0; } .tot-add b { color:var(--ac); }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 16px; } .chips span { padding:6px 12px; border-radius:999px; background:var(--s2); border:1px solid var(--line); font-size:14px; }

nav.bn { position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; justify-content:center; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
nav.bn .in2 { display:flex; width:100%; max-width:560px; }
nav.bn button { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:10px 4px 9px; background:none; border:0; color:var(--muted); font:inherit; font-size:13px; font-weight:600; cursor:pointer; }

.rod { padding-top:24px; text-align:center; color:var(--faint); font-size:13px; }
:focus-visible { outline:2px solid var(--ac); outline-offset:2px; }

</style>
