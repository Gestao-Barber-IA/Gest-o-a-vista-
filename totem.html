<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Totem de autoatendimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Hind:wght@400;500;600;700&display=swap">
<style>
:root { --bg:#0c0c0e; --s1:#161618; --s2:#1f1f22; --s3:#2a2a2e; --line:#2d2c30; --fg:#f6f2e8; --muted:#aaa59a; --faint:#6f6b63;
  --ac:#d6b46a; --ac2:#b08c42; --ink:#1d1607; --ok:#52d37e; --bad:#ff6b6b; --r:22px; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font-family:"Hind",system-ui,sans-serif; overscroll-behavior:none; user-select:none; -webkit-user-select:none; }
body { background: radial-gradient(1200px 600px at 10% -10%, rgba(52,88,190,.16), transparent 60%), radial-gradient(900px 500px at 110% 110%, rgba(212,178,102,.10), transparent 60%), var(--bg); }
.app { min-height:100%; display:flex; flex-direction:column; padding: max(18px, env(safe-area-inset-top)) 24px max(18px, env(safe-area-inset-bottom)); }
header { display:flex; align-items:center; gap:14px; min-height:56px; }
header img { width:52px; height:52px; border-radius:50%; object-fit:cover; background:var(--s2); }
header .nm { font-family:"Archivo",sans-serif; font-weight:800; font-size:20px; letter-spacing:.02em; }
header .sp { flex:1; }
.tiny { background:none; border:1px solid var(--line); color:var(--muted); border-radius:12px; padding:8px 12px; font:inherit; font-size:14px; }
main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; max-width:880px; margin:0 auto; padding:16px 0; }
h1 { font-family:"Archivo",sans-serif; font-weight:800; font-size:clamp(28px,4.2vw,44px); line-height:1.1; text-align:center; margin:0 0 8px; }
h2 { font-family:"Archivo",sans-serif; font-weight:700; font-size:clamp(22px,3vw,30px); text-align:center; margin:0 0 6px; }
p.sub { color:var(--muted); font-size:clamp(17px,2.2vw,22px); text-align:center; margin:0 0 22px; }
.fone { font-family:"Archivo",sans-serif; font-size:clamp(34px,5.5vw,54px); font-weight:700; letter-spacing:.04em; min-height:1.3em; text-align:center; margin:4px 0 18px; color:var(--fg); }
.fone.vazio { color:var(--faint); }
.pad { display:grid; grid-template-columns:repeat(3, minmax(90px,140px)); gap:14px; }
.pad button { height:clamp(72px,10vh,96px); border-radius:var(--r); border:1px solid var(--line); background:var(--s2); color:var(--fg); font-family:"Archivo",sans-serif; font-size:34px; font-weight:700; }
.pad button:active, .chip:active, .card:active, .btn:active { transform:scale(.97); }
.pad .del { font-size:22px; color:var(--muted); }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:72px; padding:0 34px; border-radius:var(--r); border:0; font-family:"Archivo",sans-serif; font-weight:800; font-size:clamp(20px,2.6vw,26px); letter-spacing:.02em; }
.btn.pri { background:linear-gradient(180deg, var(--ac), var(--ac2)); color:var(--ink); box-shadow:0 10px 30px rgba(214,180,106,.25); }
.btn.sec { background:var(--s2); color:var(--fg); border:1px solid var(--line); }
.btn.ok { background:linear-gradient(180deg,#5fe08b,#33b862); color:#062012; }
.btn[disabled] { opacity:.35; }
.acoes { display:flex; flex-wrap:wrap; gap:14px; justify-content:center; margin-top:24px; width:100%; }
.acoes .btn { flex:1 1 260px; max-width:420px; }
.link { background:none; border:0; color:var(--muted); font:inherit; font-size:18px; text-decoration:underline; margin-top:18px; padding:12px; }
.lista { width:100%; display:grid; gap:14px; }
.card { width:100%; display:flex; align-items:center; gap:18px; text-align:left; background:var(--s1); border:1px solid var(--line); border-radius:var(--r); padding:20px 22px; color:var(--fg); font:inherit; }
.card .hr { font-family:"Archivo",sans-serif; font-weight:800; font-size:34px; color:var(--ac); min-width:110px; }
.card .tx { flex:1; font-size:20px; line-height:1.3; } .card .tx b { font-size:22px; }
.card .ck { color:var(--ok); font-weight:700; font-size:18px; }
.grade { width:100%; display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:12px; max-height:52vh; overflow:auto; padding:2px; }
.opt { background:var(--s1); border:2px solid var(--line); border-radius:18px; padding:16px 18px; color:var(--fg); font:inherit; text-align:left; min-height:84px; }
.opt b { display:block; font-size:20px; line-height:1.2; } .opt small { color:var(--muted); font-size:16px; }
.opt.on { border-color:var(--ac); background:rgba(214,180,106,.12); }
.chips { display:flex; gap:10px; overflow-x:auto; width:100%; padding:4px 2px 10px; scrollbar-width:none; } .chips::-webkit-scrollbar { display:none; }
.chip { flex:0 0 auto; border-radius:999px; border:2px solid var(--line); background:var(--s1); color:var(--fg); font:inherit; font-size:19px; font-weight:600; padding:12px 20px; }
.chip.on { border-color:var(--ac); background:var(--ac); color:var(--ink); }
.prof { width:100%; background:var(--s1); border:1px solid var(--line); border-radius:var(--r); padding:16px 18px; margin-bottom:12px; }
.prof h3 { margin:0 0 10px; font-family:"Archivo",sans-serif; font-size:22px; }
.horas { display:flex; flex-wrap:wrap; gap:10px; }
.horas .chip { font-family:"Archivo",sans-serif; font-size:21px; padding:12px 18px; }
.rolar { width:100%; max-height:50vh; overflow:auto; }
.resumo { width:100%; max-width:560px; background:var(--s1); border:1px solid var(--line); border-radius:var(--r); padding:8px 24px; }
.resumo div { display:flex; justify-content:space-between; gap:16px; padding:14px 0; border-bottom:1px solid var(--line); font-size:20px; } .resumo div:last-child { border:0; }
.resumo span { color:var(--muted); } .resumo b { text-align:right; }
input.txt { width:100%; max-width:560px; height:76px; border-radius:var(--r); border:2px solid var(--line); background:var(--s1); color:var(--fg); font:inherit; font-size:28px; padding:0 22px; text-align:center; user-select:text; -webkit-user-select:text; }
input.txt:focus { outline:none; border-color:var(--ac); }
.grande { font-size:96px; line-height:1; margin-bottom:12px; }
.spin { width:64px; height:64px; border-radius:50%; border:6px solid var(--s3); border-top-color:var(--ac); animation:g 0.9s linear infinite; margin-bottom:18px; } @keyframes g { to { transform:rotate(360deg); } }
.aviso { width:100%; max-width:880px; margin:0 auto; background:rgba(255,107,107,.12); border:1px solid rgba(255,107,107,.4); color:#ffd2d2; border-radius:16px; padding:12px 16px; font-size:17px; text-align:center; }
.vazio-m { color:var(--muted); font-size:19px; text-align:center; padding:20px; }
.voltar { position:absolute; left:20px; top:max(84px, calc(env(safe-area-inset-top) + 70px)); }
h1.tit-ini { max-width:720px; }
/* Tablet em pé: teclado e botões maiores, ocupando melhor a altura. */
@media (orientation:portrait) and (min-width:600px) {
  h1 { font-size:clamp(36px,6vw,56px); }
  p.sub { font-size:clamp(20px,3vw,26px); }
  .fone { font-size:clamp(44px,7vw,64px); margin:12px 0 28px; }
  .pad { grid-template-columns:repeat(3, minmax(120px,190px)); gap:18px; }
  .pad button { height:clamp(96px,9vh,130px); font-size:42px; }
  .btn { min-height:88px; font-size:28px; }
  .acoes { margin-top:32px; }
  .grade { max-height:60vh; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); }
  .rolar { max-height:58vh; }
  .chips { flex-wrap:wrap; overflow:visible; }
}
@media (max-height:700px) { .pad button { height:64px; } .btn { min-height:62px; } }
</style>
</head>
<body>
<div class="app">
  <header><img id="logo" alt="" hidden><span class="nm" id="nome"></span><span class="sp"></span><button class="tiny" id="tela" type="button">Tela cheia</button></header>
  <div id="aviso"></div>
  <main id="m"></main>
</div>
<script>
(function () {
  'use strict';
  var URL_FN = 'https://sekkmnkajnaqubyhpxvd.supabase.co/functions/v1/totem', ANON = 'sb_publishable_H_B9KotYo03JbNmuERyf6Q_1u-RyKYB';
  var DIAS = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (t) { return String(t == null ? '' : t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var cred = null;
  try { var h = new URLSearchParams(location.hash.slice(1)); if (h.get('e') && h.get('t')) { cred = { e: h.get('e'), t: h.get('t') }; localStorage.setItem('gbTotem', JSON.stringify(cred)); history.replaceState(null, '', location.pathname); } } catch (e) { /* segue */ }
  if (!cred) { try { cred = JSON.parse(localStorage.getItem('gbTotem') || 'null'); } catch (e) { cred = null; } }
  var info = null, st = {}, tela = 'inicio', idle = null, volta = null;

  function chamar(acao, dados) {
    return fetch(URL_FN, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: ANON }, body: JSON.stringify({ empresa: cred.e, token: cred.t, acao: acao, dados: dados || {} }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok || j.erro) throw new Error(j.erro || 'Não consegui falar com a agenda. Tente de novo.'); return j; }); },
        function () { throw new Error('Sem internet no tablet. Fale com a recepção, por favor.'); });
  }
  function fmtFone(d) { if (!d) return ''; var a = d.slice(0, 2), b = d.slice(2); if (d.length <= 2) return '(' + a; var meio = b.length > 8 ? b.slice(0, 5) + '-' + b.slice(5) : b.length > 4 ? b.slice(0, 4) + '-' + b.slice(4) : b; return '(' + a + ') ' + meio; }
  function hr(h) { return String(h).replace(':', 'h'); }
  function reais(v) { return v ? 'R$ ' + Number(v).toFixed(2).replace('.', ',').replace(',00', '') : ''; }
  function diaTexto(iso) { var hoje = info.hoje, d = new Date(iso + 'T12:00:00Z'), am = new Date(hoje + 'T12:00:00Z'); am.setUTCDate(am.getUTCDate() + 1);
    if (iso === hoje) return 'Hoje'; if (iso === am.toISOString().slice(0, 10)) return 'Amanhã'; return DIAS[d.getUTCDay()] + ' ' + iso.slice(8, 10) + '/' + iso.slice(5, 7); }
  function datas() { var l = [], d = new Date(info.hoje + 'T12:00:00Z'); for (var i = 0; i < info.dias; i++) { if (info.fechados.indexOf(d.getUTCDay()) < 0) l.push(d.toISOString().slice(0, 10)); d.setUTCDate(d.getUTCDate() + 1); } return l; }

  function ir(t, extra) { tela = t; if (extra) for (var k in extra) st[k] = extra[k]; clearTimeout(volta); render(); }
  function reiniciar() { st = { fone: '' }; ir('inicio'); }
  function tocar() { clearTimeout(idle); if (tela !== 'inicio') idle = setTimeout(reiniciar, 60000); }
  function carregando(t) { $('m').innerHTML = '<div class="spin"></div><p class="sub">' + esc(t || 'Um instante…') + '</p>'; }
  function erro(e) { ir('erro', { erro: e.message || String(e) }); }
  function voltarEm(s) { clearTimeout(volta); volta = setTimeout(reiniciar, s * 1000); }

  function render() {
    var m = $('m'), h = '';
    $('aviso').innerHTML = info && info.ativo && !info.online ? '<div class="aviso">A agenda está sem conexão agora. Para check-in ou agendamento, fale com a recepção.</div>' : '';
    if (tela === 'inicio') {
      var d = st.fone || '';
      h = '<h1 class="tit-ini">Faça o check-in ou agende seu horário agora</h1><p class="sub">Digite seu celular com DDD</p>' +
        '<div class="fone' + (d ? '' : ' vazio') + '">' + (d ? esc(fmtFone(d)) : '(00) 00000-0000') + '</div><div class="pad">' +
        [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return '<button type="button" data-k="' + n + '">' + n + '</button>'; }).join('') +
        '<button type="button" class="del" data-k="del" aria-label="Apagar">⌫</button><button type="button" data-k="0">0</button><button type="button" class="del" data-k="lim" aria-label="Limpar">Limpar</button></div>' +
        '<div class="acoes"><button class="btn pri" type="button" data-a="buscar"' + (d.length >= 10 ? '' : ' disabled') + '>Continuar</button></div>';
    } else if (tela === 'agendado') {
      var r = st.busca;
      h = '<h1>Olá, ' + esc(r.nome || 'tudo bem') + '! 👋</h1><p class="sub">' + (r.horarios.length > 1 ? 'Seus horários de hoje:' : 'Seu horário de hoje:') + '</p><div class="lista">' +
        r.horarios.map(function (x, i) { return '<div class="card"><span class="hr">' + esc(hr(x.hora)) + '</span><span class="tx"><b>' + esc(x.servicos || 'Atendimento') + '</b><br>com ' + esc(x.profissional) + '</span>' +
          (x.chegou ? '<span class="ck">✓ Check-in feito</span>' : '<button class="btn ok" type="button" data-a="chegou" data-i="' + i + '">Cheguei</button>') + '</div>'; }).join('') +
        '</div><button class="link" type="button" data-a="novo">Quero agendar outro horário</button><button class="link" type="button" data-a="inicio">Não sou eu · Voltar</button>';
    } else if (tela === 'chegou_ok') {
      h = '<div class="grande">✅</div><h1>Pronto, ' + esc(st.busca.nome || '') + '!</h1><p class="sub">Check-in feito. ' + (st.ok.avisado ? esc(st.ok.profissional) + ' já foi avisado' + (/a$/i.test(st.ok.profissional) ? 'a' : '') + '. ' : '') + 'Fique à vontade, já já chamamos você. ☕</p>' +
        '<div class="acoes"><button class="btn sec" type="button" data-a="inicio">Concluir</button></div>'; voltarEm(10);
    } else if (tela === 'sem_horario') {
      var nm = st.busca.nome;
      h = '<h1>Olá' + (nm ? ', ' + esc(nm) : '') + '! 👋</h1><p class="sub">Você não tem horário marcado para hoje.<br>Quer agendar agora?</p>' +
        '<div class="acoes"><button class="btn pri" type="button" data-a="novo">Agendar agora</button><button class="btn sec" type="button" data-a="inicio">Voltar</button></div>';
    } else if (tela === 'nome') {
      h = '<h2>Primeira vez por aqui? Seja bem-vindo! 😊</h2><p class="sub">Qual é o seu nome e sobrenome?</p><input class="txt" id="inNome" autocomplete="off" autocapitalize="words" maxlength="60" value="' + esc(st.nome || '') + '" placeholder="Ex.: João Silva">' +
        '<div class="acoes"><button class="btn pri" type="button" data-a="nomeOk">Continuar</button><button class="btn sec" type="button" data-a="inicio">Cancelar</button></div>';
    } else if (tela === 'servico') {
      var sel = st.sel || [];
      h = '<h2>Qual serviço você quer fazer?</h2><p class="sub">Pode escolher mais de um (até 3)</p><div class="grade">' +
        st.servicos.map(function (s) { return '<button type="button" class="opt' + (sel.indexOf(s.codigo) >= 0 ? ' on' : '') + '" data-a="serv" data-c="' + s.codigo + '"><b>' + esc(s.nome) + '</b><small>' + (s.minutos ? s.minutos + ' min' : '') + '</small></button>'; }).join('') +
        '</div><div class="acoes"><button class="btn pri" type="button" data-a="servOk"' + (sel.length ? '' : ' disabled') + '>Continuar</button><button class="btn sec" type="button" data-a="inicio">Cancelar</button></div>';
    } else if (tela === 'horario') {
      var profs = st.profs || [], pf = st.pf || 0, lst = pf ? profs.filter(function (p) { return p.codigo === pf; }) : profs;
      h = '<h2>Escolha o dia e o horário</h2><div class="chips">' + datas().map(function (d) { return '<button type="button" class="chip' + (d === st.data ? ' on' : '') + '" data-a="dia" data-d="' + d + '">' + esc(diaTexto(d)) + '</button>'; }).join('') + '</div>' +
        (st.carregandoHoras ? '<div class="spin"></div>' : profs.length ? '<div class="chips"><button type="button" class="chip' + (!pf ? ' on' : '') + '" data-a="pf" data-p="0">Qualquer profissional</button>' + profs.map(function (p) { return '<button type="button" class="chip' + (pf === p.codigo ? ' on' : '') + '" data-a="pf" data-p="' + p.codigo + '">' + esc(p.nome) + '</button>'; }).join('') + '</div>' +
          '<div class="rolar">' + lst.map(function (p) { return '<div class="prof"><h3>' + esc(p.nome) + '</h3><div class="horas">' + p.horarios.map(function (x) { return '<button type="button" class="chip" data-a="hora" data-p="' + p.codigo + '" data-h="' + esc(x.hora) + '">' + esc(hr(x.hora)) + '</button>'; }).join('') + '</div></div>'; }).join('') + '</div>'
          : '<p class="vazio-m">Não há horários livres neste dia. Escolha outro dia acima.</p>') +
        '<div class="acoes"><button class="btn sec" type="button" data-a="voltaServ">Voltar</button></div>';
    } else if (tela === 'confirmar') {
      var c = st.escolha;
      h = '<h2>Confira seu agendamento</h2><p class="sub">Está tudo certo?</p><div class="resumo"><div><span>Nome</span><b>' + esc(st.nomeAg || '') + '</b></div><div><span>Serviço</span><b>' + esc(c.servicos) + '</b></div><div><span>Profissional</span><b>' + esc(c.prof) + '</b></div>' +
        '<div><span>Dia</span><b>' + esc(diaTexto(st.data)) + '</b></div><div><span>Horário</span><b>' + esc(hr(c.hora)) + '</b></div>' + (c.preco && (st.sel || []).length === 1 ? '<div><span>Valor</span><b>' + esc(reais(c.preco)) + '</b></div>' : '') + '</div>' +
        '<div class="acoes"><button class="btn pri" type="button" data-a="agendar">Confirmar agendamento</button><button class="btn sec" type="button" data-a="voltaHora">Voltar</button></div>';
    } else if (tela === 'agendado_ok') {
      var a = st.ag;
      h = '<div class="grande">✂️</div><h1>Agendado, ' + esc(a.nome) + '!</h1><p class="sub">' + esc(diaTexto(a.data)) + ' às ' + esc(hr(a.hora)) + ' com ' + esc(a.profissional) + '<br>' + esc(a.servicos) + (a.chegou ? '<br><br>Seu check-in já está feito. Fique à vontade! ☕' : '') + '</p>' +
        '<div class="acoes"><button class="btn sec" type="button" data-a="inicio">Concluir</button></div>'; voltarEm(12);
    } else if (tela === 'erro') {
      h = '<div class="grande">⚠️</div><h2>' + esc(st.erro) + '</h2><div class="acoes"><button class="btn sec" type="button" data-a="' + (st.voltarPara || 'inicio') + '">' + (st.voltarPara ? 'Voltar' : 'Voltar ao início') + '</button></div>'; voltarEm(20);
    } else if (tela === 'sem_link') {
      h = '<h2>Totem não configurado</h2><p class="sub">No app Gestão Barber IA, vá em Integração › Totem de autoatendimento, toque em “Gerar link do totem” e abra o link neste tablet.</p>';
    } else if (tela === 'desligado') {
      h = '<h2>Totem desligado</h2><p class="sub">Fale com a recepção, por favor. 😊</p>';
    }
    m.innerHTML = h;
  }

  function horas() {
    st.carregandoHoras = true; st.profs = []; render();
    chamar('horarios', { data: st.data, servico: st.sel[0] }).then(function (r) { st.carregandoHoras = false; st.profs = r.profissionais || []; if (st.pf && !st.profs.some(function (p) { return p.codigo === st.pf; })) st.pf = 0; render(); })
      .catch(function (e) { st.carregandoHoras = false; ir('erro', { erro: e.message, voltarPara: 'voltaServ' }); });
  }
  function agendarFluxo() {
    carregando('Carregando os serviços…');
    (st.servicos ? Promise.resolve({ servicos: st.servicos }) : chamar('servicos')).then(function (r) { st.servicos = r.servicos || []; st.sel = []; ir('servico'); }).catch(erro);
  }

  document.addEventListener('click', function (ev) {
    tocar();
    var b = ev.target.closest('button'); if (!b || b.disabled) return;
    var k = b.getAttribute('data-k'), a = b.getAttribute('data-a');
    if (k) { var d = st.fone || ''; if (k === 'del') d = d.slice(0, -1); else if (k === 'lim') d = ''; else if (d.length < 11) d += k; st.fone = d; return render(); }
    if (a === 'inicio') return reiniciar();
    if (a === 'buscar') { carregando('Procurando seu horário…');
      return chamar('buscar', { fone: st.fone }).then(function (r) { st.busca = r; st.nomeAg = r.nome; ir(r.agendado ? 'agendado' : 'sem_horario'); }).catch(erro); }
    if (a === 'chegou') { var x = st.busca.horarios[Number(b.getAttribute('data-i'))]; carregando('Fazendo seu check-in…');
      return chamar('chegou', { fone: st.fone, codigos: x.codigos }).then(function (r) { x.chegou = true; ir('chegou_ok', { ok: r }); }).catch(erro); }
    if (a === 'novo') { if (!st.busca.agendado && !st.busca.cadastrado) return ir('nome'); return agendarFluxo(); }
    if (a === 'nomeOk') { var n = ($('inNome').value || '').replace(/\s+/g, ' ').trim();
      if (n.split(' ').length < 2 || n.length < 5) { $('inNome').focus(); $('inNome').placeholder = 'Digite nome e sobrenome'; $('inNome').value = n; return; }
      st.nome = n; st.nomeAg = n.split(' ')[0]; return agendarFluxo(); }
    if (a === 'serv') { var c = Number(b.getAttribute('data-c')), s = st.sel || [], i = s.indexOf(c); if (i >= 0) s.splice(i, 1); else if (s.length < 3) s.push(c); st.sel = s; return render(); }
    if (a === 'servOk') { st.data = datas()[0]; st.pf = 0; ir('horario'); return horas(); }
    if (a === 'voltaServ') return ir('servico');
    if (a === 'dia') { st.data = b.getAttribute('data-d'); return horas(); }
    if (a === 'pf') { st.pf = Number(b.getAttribute('data-p')); return render(); }
    if (a === 'hora') { var p = (st.profs || []).filter(function (q) { return q.codigo === Number(b.getAttribute('data-p')); })[0], hh = b.getAttribute('data-h'), slot = p.horarios.filter(function (q) { return q.hora === hh; })[0];
      var nomes = st.sel.map(function (cd) { return (st.servicos.filter(function (q) { return q.codigo === cd; })[0] || {}).nome; }).join(' + ');
      return ir('confirmar', { escolha: { prof: p.nome, profCod: p.codigo, hora: hh, preco: slot && slot.preco, servicos: nomes } }); }
    if (a === 'voltaHora') return ir('horario');
    if (a === 'agendar') { carregando('Agendando…');
      return chamar('agendar', { fone: st.fone, nome: st.nome || '', servicos: st.sel, profissional: st.escolha.profCod, data: st.data, hora: st.escolha.hora })
        .then(function (r) { ir('agendado_ok', { ag: r }); }).catch(function (e) { ir('erro', { erro: e.message, voltarPara: /ocupado|outro/i.test(e.message) ? 'voltaHoraRecarrega' : '' }); }); }
    if (a === 'voltaHoraRecarrega') { ir('horario'); return horas(); }
  });
  document.addEventListener('touchstart', tocar, { passive: true });
  $('tela').addEventListener('click', function () { var el = document.documentElement; if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen().catch(function () {}); });
  // Tela sempre ligada (quando o navegador permite).
  var trava = null; function manterLigada() { if ('wakeLock' in navigator && !trava) navigator.wakeLock.request('screen').then(function (t) { trava = t; t.addEventListener('release', function () { trava = null; }); }).catch(function () {}); }
  document.addEventListener('click', manterLigada); document.addEventListener('visibilitychange', function () { if (!document.hidden) manterLigada(); });

  function carregarInfo() {
    if (!cred) return ir('sem_link');
    return chamar('info').then(function (r) {
      var antes = info; info = r;
      $('nome').textContent = r.nome || ''; if (r.logo) { $('logo').src = r.logo; $('logo').hidden = false; }
      document.title = 'Totem · ' + (r.nome || 'Autoatendimento');
      if (!r.ativo) return ir('desligado');
      if (!antes || tela === 'desligado' || tela === 'sem_link') reiniciar(); else if (tela === 'inicio') render();
    }).catch(function (e) { if (/inválido/i.test(e.message)) { try { localStorage.removeItem('gbTotem'); } catch (x) { /* segue */ } cred = null; return ir('sem_link'); } if (!info) ir('erro', { erro: e.message }); });
  }
  carregarInfo(); setInterval(function () { if (tela === 'inicio' || tela === 'desligado') carregarInfo(); }, 60000);
})();
</script>
