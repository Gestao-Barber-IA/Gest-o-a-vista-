<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Gestão Salão IA (logo provisório)</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6d9b8"/><stop offset=".45" stop-color="#e3a9a3"/><stop offset="1" stop-color="#c9925a"/>
    </linearGradient>
    <radialGradient id="bg" cx=".5" cy=".38" r=".7">
      <stop offset="0" stop-color="#3a2129"/><stop offset="1" stop-color="#140c10"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7dcb4"/><stop offset="1" stop-color="#c99354"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2b8b4"/><stop offset="1" stop-color="#c97b80"/>
    </linearGradient>
    <path id="arc" d="M 106 256 A 150 150 0 0 1 406 256"/>
  </defs>
  <circle cx="256" cy="256" r="246" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#ring)" stroke-width="12"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#e3a9a3" stroke-opacity=".35" stroke-width="2"/>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="34" letter-spacing="10" fill="#f1c9b9" text-anchor="middle"><textPath href="#arc" startOffset="50%">GESTÃO</textPath></text>
  <!-- esmalte -->
  <g transform="translate(176 150)">
    <rect x="22" y="0" width="36" height="56" rx="6" fill="url(#gold)"/>
    <rect x="16" y="52" width="48" height="10" rx="3" fill="#b9864c"/>
    <path d="M6 66 h68 a10 10 0 0 1 10 10 v74 a22 22 0 0 1 -22 22 h-44 a22 22 0 0 1 -22 -22 v-74 a10 10 0 0 1 10 -10z" fill="url(#rose)"/>
    <path d="M18 82 v52" stroke="#fff" stroke-opacity=".55" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- tesoura -->
  <g transform="translate(300 150) rotate(18)" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linecap="round">
    <path d="M10 0 L54 116"/><path d="M58 0 L14 116"/>
    <circle cx="10" cy="140" r="20"/><circle cx="58" cy="140" r="20"/>
    <circle cx="34" cy="62" r="4" fill="#f7dcb4" stroke="none"/>
  </g>
  <text x="256" y="388" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="700" letter-spacing="4" fill="url(#gold)" text-anchor="middle">SALÃO</text>
  <text x="256" y="436" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" letter-spacing="8" fill="#e3a9a3" text-anchor="middle">IA</text>
</svg>
